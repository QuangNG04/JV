<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Gallery</title>
<style>
#image { width: 400px; height: 300px; object-fit: cover; }
 .preview { width: 100px; height: 75px; margin: 5px; cursor: pointer; }
 .preview-box {
    width: 400px;
    height: 300px;
    border: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: #555;
    background-color: #fff;
    margin-bottom: 10px;
}
#image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>
<body>

<div>
 <div id="image" class="preview-box">Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.</div>
 <img class="preview" src="https://picsum.photos/id/1015/400/300" alt="Ảnh 1" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://picsum.photos/id/1016/400/300" alt="Ảnh 2" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://picsum.photos/id/1019/400/300" alt="Ảnh 3" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://picsum.photos/id/1020/400/300" alt="Ảnh 4" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://picsum.photos/id/1024/400/300" alt="Ảnh 5" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://picsum.photos/id/1025/400/300" alt="Ảnh 6" onmouseover="upDate(this)" onmouseout="unDo()">
</div>

<script>
function upDate(previewPic) {
    console.log("Sự kiện kích hoạt: Di chuyển vào/Focus ảnh");
    document.getElementById('image').innerHTML = `<img src="${previewPic.src}" alt="${previewPic.alt}" style="width:100%; height:100%; object-fit:cover;">`;
}

function unDo() {
    console.log("Sự kiện kích hoạt: Rời khỏi/Blur ảnh");
    document.getElementById('image').innerHTML = "Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.";
}
window.onload = function() {  console.log("Trang đã tải xong (onload)");
 const images = document.querySelectorAll('.preview');

 for (let i = 0; i < images.length; i++) {
 console.log("Đang xử lý ảnh thứ: " + i);
 images[i].setAttribute('tabindex', '0');

 images[i].addEventListener('mouseover', function() {
upDate(this);
 });
 images[i].addEventListener('mouseleave', function() {
 unDo();
 });
 images[i].addEventListener('focus', function() {
 upDate(this);
});
images[i].addEventListener('blur', function() {
 unDo();
 });
 }
};
</script>

</body>
</html>
